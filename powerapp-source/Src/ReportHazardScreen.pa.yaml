            X: =712
            Y: =226
      - TextInput1:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =RGBA(0, 0, 0, 1)
            Default: |-
              ="GPS: " & Text(Location.Latitude) & ", " & Text(Location.Longitude)
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            DisabledColor: =RGBA(161, 159, 157, 1)
            DisabledFill: =RGBA(242, 242, 241, 0)
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Bold
            Height: =84
            HoverBorderColor: =RGBA(16, 110, 190, 1)
            HoverColor: =RGBA(50, 49, 48, 1)
            HoverFill: =RGBA(255, 255, 255, 1)
            PressedBorderColor: =RGBA(0, 120, 212, 1)
            PressedColor: =RGBA(50, 49, 48, 1)
            PressedFill: =RGBA(255, 255, 255, 1)
            RadiusBottomLeft: =10
            RadiusBottomRight: =10
            RadiusTopLeft: =10
            RadiusTopRight: =10
            Width: =540
            X: =712
            Y: =358
      - Button1:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            DisabledColor: =RGBA(161, 159, 157, 1)
            DisabledFill: =RGBA(242, 242, 241, 0)
            Fill: =RGBA(141, 198, 63, 1)
            Font: =Font.'Segoe UI'
            Height: =92
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(16, 110, 190, 1)
            OnSelect: |-
              =Set(
                  varNewIncidentID,
                  "INC-" & Text(Now(), "yyyymmddhhmmss")
              );

              Patch(
                  'List 1: Incidents',
                  Defaults('List 1: Incidents'),
                  {
                      Title: varNewIncidentID,
                      IncidentID: varNewIncidentID,
                      IncidentType: {Value: "Fire"},
                      Description: TextInput2.Text,
                      Severity: {Value: drpFireSeverity.Selected.Value},
                      Latitude: Location.Latitude,
                      Longitude: Location.Longitude,
                      LocationText: TextInput2_1.Text,
                      SubmittedTime: Now(),
                      Status: {Value: "New"},
                      SubmittedByEmail: User().Email
                  }
              );

              Set(varLastSubmissionType, "Fire Alert");

              Set(varSubmittedTime, Now());

              Navigate(ConfirmationScreen, ScreenTransition.Fade)
            PressedBorderColor: =RGBA(0, 69, 120, 1)
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =RGBA(16, 110, 190, 1)
            RadiusBottomLeft: =20
            RadiusBottomRight: =20
            RadiusTopLeft: =20
            RadiusTopRight: =20
            Text: ="SUBMIT"
            Width: =540
            X: =712
            Y: =498
