Screens:
  MyAssignmentsScreen:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |-
        =Refresh(Assignments);
        Refresh('List 1: Incidents');
        Refresh(Volunteers)
    Children:
      - lblHomeTitle_7:
          Control: ModernText@1.0.0
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(255, 255, 255, 1)
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(215, 58, 60, 1)
            Font: =Font.'Lato Black'
            FontWeight: |
              =FontWeight.Bold
            Height: =120
            Size: |
              =28
            Text: ="MY ASSIGNMENTS"
            Width: =1366
      - galMyAssignments:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_OneTextVariant_ver5.0
          Properties:
            BorderColor: =RGBA(245, 245, 245, 1)
            Height: =403
            Items: =Assignments
            TemplateSize: =198
            Width: =1220
            X: =73
            Y: =157
          Children:
            - Title13:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Color: =RGBA(50, 49, 48, 1)
                  DisabledColor: =RGBA(161, 159, 157, 1)
                  Font: =Font.'Segoe UI'
                  FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                  Height: =Self.Size * 1.8
                  OnSelect: =Select(Parent)
                  PaddingBottom: =0
                  PaddingLeft: =12
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =14
                  Text: =ThisItem.Title
                  VerticalAlign: =VerticalAlign.Top
                  Width: =Parent.TemplateWidth - 86
                  X: =16
                  Y: =(Parent.TemplateHeight / 2) - (Self.Height / 2)
            - NextArrow13:
                Control: Classic/Icon@2.5.0
                Properties:
                  AccessibleLabel: =Self.Tooltip
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Color: =RGBA(166, 166, 166, 1)
                  DisabledBorderColor: =RGBA(245, 245, 245, 1)
                  DisabledColor: =RGBA(225, 223, 221, 1)
                  DisabledFill: =RGBA(0, 0, 0, 0)
                  FocusedBorderThickness: =4
                  Height: =50
                  HoverBorderColor: =RGBA(0, 0, 0, 0)
                  HoverColor: =RGBA(16, 110, 190, 1)
                  HoverFill: =RGBA(0, 0, 0, 0)
                  Icon: =Icon.ChevronRight
                  OnSelect: =Select(Parent)
                  PaddingBottom: =12
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =12
                  PressedBorderColor: =RGBA(0, 0, 0, 0)
                  PressedColor: =RGBA(16, 110, 190, 1)
                  PressedFill: =RGBA(0, 0, 0, 0)
                  Tooltip: ="View item details"
                  Width: =50
                  X: =Parent.TemplateWidth - Self.Width - 12
                  Y: =(Parent.TemplateHeight / 2) - (Self.Height / 2)
            - Separator13:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Fill: =RGBA(255, 255, 255, 1)
                  Height: =8
                  OnSelect: =Select(Parent)
                  Width: =Parent.TemplateWidth
                  Y: =Parent.TemplateHeight - Self.Height
            - Rectangle14:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Fill: =RGBA(0, 120, 212, 1)
                  Height: =Parent.TemplateHeight - Separator13.Height
                  OnSelect: =Select(Parent)
                  Visible: =ThisItem.IsSelected
                  Width: =4
            - Label18:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  BorderStyle: =BorderStyle.None
                  BorderThickness: =2
                  Color: =RGBA(50, 49, 48, 1)
                  DisabledBorderColor: =RGBA(0, 0, 0, 0)
                  DisabledColor: =RGBA(161, 159, 157, 1)
                  FocusedBorderThickness: =4
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =119
                  OnSelect: =Select(Parent)
                  Size: =17
                  Text: |-
                    ="Description: " &
                    LookUp(
                        'List 1: Incidents',
                        IncidentID = ThisItem.IncidentID
                    ).Description
                  X: =272
                  Y: =19
            - Label18_1:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  BorderStyle: =BorderStyle.None
                  BorderThickness: =2
                  Color: =RGBA(50, 49, 48, 1)
                  DisabledBorderColor: =RGBA(0, 0, 0, 0)
                  DisabledColor: =RGBA(161, 159, 157, 1)
                  FocusedBorderThickness: =4
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =91
                  OnSelect: =Select(Parent)
                  Size: =17
                  Text: |-
                    ="Location: " &
                    LookUp(
                        'List 1: Incidents',
                        IncidentID = ThisItem.IncidentID
                    ).LocationText
                  X: =451
                  Y: =38
            - Label18_2:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  BorderStyle: =BorderStyle.None
                  BorderThickness: =2
                  Color: =RGBA(50, 49, 48, 1)
                  DisabledBorderColor: =RGBA(0, 0, 0, 0)
                  DisabledColor: =RGBA(161, 159, 157, 1)
                  FocusedBorderThickness: =4
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =131
                  OnSelect: =Select(Parent)
                  Size: =15
                  Text: |-
                    ="Assigned: " & Text(ThisItem.AssignedTime, "dd/mm/yyyy hh:mm")
                  X: =601
                  Y: =19
            - Button9:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  BorderStyle: =BorderStyle.None
                  Color: =RGBA(255, 255, 255, 1)
                  DisabledBorderColor: =RGBA(0, 0, 0, 0)
                  DisabledColor: =RGBA(161, 159, 157, 1)
                  DisabledFill: =RGBA(242, 242, 241, 0)
                  Fill: =RGBA(152, 208, 70, 1)
                  Font: =Font.'Segoe UI'
                  HoverBorderColor: =RGBA(0, 0, 0, 0)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =RGBA(16, 110, 190, 1)
                  OnSelect: |-
                    =Patch(
                        Assignments,
                        ThisItem,
                        {
                            ResponseStatus: {Value: "Accepted"}
                        }
                    );

                    Patch(
                        'List 1: Incidents',
                        LookUp(
                            'List 1: Incidents',
                            IncidentID = ThisItem.IncidentID
                        ),
                        {
                            Status: {Value: "In Progress"}
                        }
                    );

                    Set(varAcceptedAssignment, ThisItem);

                    Set(
                        varAcceptedIncident,
                        LookUp(
                            'List 1: Incidents',
                            IncidentID = ThisItem.IncidentID
                        )
                    );

                    Refresh(Assignments);
                    Refresh('List 1: Incidents');

                    Notify("Assignment accepted. Opening incident directions.", NotificationType.Success);

                    Navigate(IncidentDirectionsScreen, ScreenTransition.Fade)
                  PressedBorderColor: =RGBA(0, 69, 120, 1)
                  PressedColor: =RGBA(255, 255, 255, 1)
                  PressedFill: =RGBA(16, 110, 190, 1)
                  RadiusBottomLeft: =20
                  RadiusBottomRight: =20
                  RadiusTopLeft: =20
                  RadiusTopRight: =20
                  Text: ="Accept"
                  X: =836
                  Y: =64
            - Button10:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  BorderStyle: =BorderStyle.None
                  Color: =RGBA(255, 255, 255, 1)
                  DisabledBorderColor: =RGBA(0, 0, 0, 0)
                  DisabledColor: =RGBA(161, 159, 157, 1)
                  DisabledFill: =RGBA(242, 242, 241, 0)
                  Fill: =RGBA(255, 0, 0, 1)
                  Font: =Font.'Segoe UI'
                  HoverBorderColor: =RGBA(0, 0, 0, 0)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =RGBA(16, 110, 190, 1)
                  OnSelect: |-
                    =Patch(
                        Assignments,
                        ThisItem,
                        {
                            ResponseStatus: {Value: "Declined"}
                        }
                    );

                    Patch(
                        Volunteers,
                        LookUp(
                            Volunteers,
                            VolunteerID = ThisItem.VolunteerID
                        ),
                        {
                            Availability: {Value: "Available"}
                        }
                    );

                    Patch(
                        'List 1: Incidents',
                        LookUp(
                            'List 1: Incidents',
                            IncidentID = ThisItem.IncidentID
                        ),
                        {
                            Status: {Value: "New"}
                        }
                    );

                    Refresh(Assignments);
                    Refresh(Volunteers);
                    Refresh('List 1: Incidents');

                    Notify("Assignment declined.", NotificationType.Warning)
                  PressedBorderColor: =RGBA(0, 69, 120, 1)
                  PressedColor: =RGBA(255, 255, 255, 1)
                  PressedFill: =RGBA(16, 110, 190, 1)
                  RadiusBottomLeft: =20
                  RadiusBottomRight: =20
                  RadiusTopLeft: =20
                  RadiusTopRight: =20
                  Text: ="Decline"
                  X: =1048
                  Y: =64
      - Button2_5:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(255, 255, 255, 1)
            BorderStyle: =BorderStyle.None
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            DisabledColor: =RGBA(161, 159, 157, 1)
            DisabledFill: =RGBA(242, 242, 241, 0)
            Fill: =RGBA(215, 58, 60, 1)
            Font: =Font.'Segoe UI'
            Height: =52
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =RGBA(0, 0, 0, 1)
            HoverFill: =RGBA(255, 255, 255, 1)
            OnSelect: =Back()
            PressedBorderColor: =RGBA(255, 255, 255, 1)
            PressedColor: =RGBA(0, 0, 0, 1)
            PressedFill: =RGBA(255, 255, 255, 1)
            Size: =20
            Text: ="< Back"
            Width: =170
            X: =40
            Y: =34
      - Button11:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            DisabledColor: =RGBA(161, 159, 157, 1)
            DisabledFill: =RGBA(242, 242, 241, 0)
            Fill: =RGBA(0, 120, 212, 1)
            Font: =Font.'Segoe UI'
            Height: =56
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(16, 110, 190, 1)
            OnSelect: =Navigate(WelcomeScreen)
            PressedBorderColor: =RGBA(0, 69, 120, 1)
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =RGBA(16, 110, 190, 1)
            RadiusBottomLeft: =20
            RadiusBottomRight: =20
            RadiusTopLeft: =20
            RadiusTopRight: =20
            Text: ="HOME"
            Width: =196
            X: =144
            Y: =615
