                  HoverBorderColor: =RGBA(0, 0, 0, 0)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =RGBA(16, 110, 190, 1)
                  OnSelect: "=If(\n    galAvailableVolunteers.Selected.Availability.Value <> \"Available\",\n    \n    Notify(\n        \"Error: This volunteer is not available. Please choose an available volunteer.\",\n        NotificationType.Error\n    ),\n    \n    Set(\n        varNewAssignmentID,\n        \"ASN-\" & Text(Now(), \"yyyymmddhhmmss\")\n    );\n\n    Patch(\n        Assignments,\n        Defaults(Assignments),\n        {\n            Title: varNewAssignmentID,\n            AssignmentID: varNewAssignmentID,\n            IncidentID: varSelectedIncident.IncidentID,\n            VolunteerID: galAvailableVolunteers.Selected.VolunteerID,\n            VolunteerName: galAvailableVolunteers.Selected.FullName,\n            VolunteerEmail: galAvailableVolunteers.Selected.Email,\n            AssignedBy: User().Email,\n            AssignedTime: Now(),\n            ResponseStatus: {Value: \"Pending\"},\n            Notes: txtAssignmentNotes.Text\n        }\n    );\n\n    Patch(\n        Volunteers,\n        galAvailableVolunteers.Selected,\n        {\n            Availability: {Value: \"Assigned\"}\n        }\n    );\n\n    Patch(\n        'List 1: Incidents',\n        varSelectedIncident,\n        {\n            Status: {Value: \"Assigned\"}\n        }\n    );\n\n    Refresh(Assignments);\n    Refresh(Volunteers);\n    Refresh('List 1: Incidents');\n\n    Notify(\n        \"Volunteer assigned successfully.\",\n        NotificationType.Success\n    );\n\n    Navigate(ManagerDashboardScreen, ScreenTransition.Fade)\n)"
